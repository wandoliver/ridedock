name: Setup RideDock PHP
description: Install the pinned PHP dependencies and an isolated CI environment.

inputs:
  php-version:
    description: PHP version to install.
    required: false
    default: '8.4'

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: curl, dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3, xml
        coverage: none
        tools: composer:v2

    - name: Locate Composer download cache
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-php-${{ inputs.php-version }}-${{ hashFiles('composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-php-${{ inputs.php-version }}-

    - name: Prepare CI environment
      shell: bash
      run: cp .env.example .env

    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist --no-progress
